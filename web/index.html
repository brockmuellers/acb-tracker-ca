<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACB Calculator (dev)</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.25rem; }
    .acb-subtitle { color: #555; margin-bottom: 1.5rem; }

    #acb-status { padding: 0.75rem; background: #f0f0f0; border-radius: 4px; }
    #acb-status.acb-error { background: #fee; color: #900; }

    #acb-form { display: none; }

    fieldset { border: 1px solid #ccc; border-radius: 4px; padding: 1rem; margin-bottom: 1rem; }
    legend { font-weight: bold; padding: 0 0.4rem; }

    .acb-source { border: 1px solid #ddd; border-radius: 4px; padding: 0.75rem; margin-bottom: 0.5rem; }
    .acb-source-fields { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; }
    .acb-source-fields label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.9rem; }
    .acb-hint { font-weight: normal; color: #777; font-size: 0.8rem; }

    select, input[type="text"], input[type="date"] {
      padding: 0.3rem 0.4rem; border: 1px solid #aaa; border-radius: 3px; font-size: 0.9rem;
    }

    button {
      padding: 0.4rem 0.9rem; border: 1px solid #aaa; border-radius: 3px;
      background: #f5f5f5; cursor: pointer; font-size: 0.9rem;
    }
    button:hover { background: #e8e8e8; }
    button:disabled { opacity: 0.5; cursor: default; }
    #acb-run {
      padding: 0.5rem 1.5rem; background: #2a6; border-color: #1a5; color: #fff; font-size: 1rem;
    }
    #acb-run:hover:not(:disabled) { background: #1a5; }

    .acb-optional-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; }
    .acb-optional-row label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.9rem; }

    #acb-error {
      display: none; padding: 0.75rem; background: #fee; border: 1px solid #f99;
      border-radius: 4px; margin: 1rem 0; white-space: pre-wrap; color: #900;
    }
    #acb-warnings {
      display: none; padding: 0.75rem; background: #fff8e0; border: 1px solid #e8c840;
      border-radius: 4px; margin: 1rem 0; white-space: pre-wrap;
    }

    #acb-results { display: none; margin-top: 1.5rem; }
    #acb-results h2 { margin-top: 1.5rem; margin-bottom: 0.5rem; }
    #acb-download { display: none; margin-bottom: 1rem; }

    table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
    th { background: #f0f0f0; border: 1px solid #ccc; padding: 0.3rem 0.5rem; text-align: left; white-space: nowrap; }
    td { border: 1px solid #ddd; padding: 0.3rem 0.5rem; white-space: nowrap; }
    tr:nth-child(even) td { background: #fafafa; }

    .acb-mapping-row { margin-top: 0.5rem; }
    .acb-mapping-row label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.9rem; }
    .acb-mapping { font-family: monospace; font-size: 0.8rem; width: 100%; box-sizing: border-box; resize: vertical; border: 1px solid #aaa; border-radius: 3px; padding: 0.3rem 0.4rem; }

    .acb-actions { margin-top: 1rem; display: flex; gap: 0.5rem; align-items: center; }

    .acb-sample-hint { margin: 0 0 1rem; color: #555; font-size: 0.9rem; }
    .acb-sample-hint button { background: none; border: none; color: #2a6; cursor: pointer; font-size: 0.9rem; padding: 0; text-decoration: underline; }
    .acb-sample-hint button:hover { color: #1a5; }
    .acb-sample-badge { font-size: 0.75rem; background: #e8f4e8; color: #2a6; border: 1px solid #2a6; border-radius: 3px; padding: 0.1rem 0.4rem; margin-left: 0.25rem; }
  </style>
</head>
<body>

<h1>ACB Calculator</h1>
<p class="acb-subtitle">Computes adjusted cost base and capital gains for Canadian tax purposes. Files are processed locally — nothing is uploaded.</p>

<div id="acb-status">Loading…</div>

<div id="acb-form">
  <p class="acb-sample-hint">New here? <button type="button" id="acb-load-sample">Load sample data</button> to try the calculator with demo transactions.</p>
  <fieldset>
    <legend>Sources</legend>
    <div id="acb-sources"></div>
    <button type="button" id="acb-add-source">+ Add source</button>
  </fieldset>

  <fieldset>
    <legend>Options</legend>
    <div class="acb-optional-row">
      <label>FX rate file <span class="acb-hint">(Bank of Canada CSV, optional)</span>
        <input type="file" id="acb-fx-file" accept=".csv">
      </label>
      <label>Start date <span class="acb-hint">(optional)</span>
        <input type="date" id="acb-start">
      </label>
      <label>End date <span class="acb-hint">(optional)</span>
        <input type="date" id="acb-end">
      </label>
    </div>
  </fieldset>

  <div class="acb-actions">
    <button type="button" id="acb-run">Run</button>
  </div>
</div>

<div id="acb-error"></div>
<div id="acb-warnings"></div>

<div id="acb-results">
  <h2>Holdings</h2>
  <div id="acb-holdings-table"></div>

  <h2>Transactions</h2>
  <button type="button" id="acb-download">Download CSV</button>
  <div id="acb-transactions-table"></div>
</div>

<script>
  // Set to '..' so app.js fetches sibling files from the repo root during local dev.
  // The Jekyll page will override this with the raw.githubusercontent.com base URL.
  window.ACB_BASE_URL = '..';
</script>
<script src="app.js"></script>

</body>
</html>
