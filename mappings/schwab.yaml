column_map:
  Date: date
  Symbol: ticker
  Action: type
  Quantity: quantity
  Price: price
  Superficial Qty: superficial_qty
  Time: time

optional_columns:
  - Superficial Qty
  - Time

type_map:
  Buy: BUY
  Sell: SELL
  Reinvest Shares: BUY
  Journaled Shares: BUY
  Security Transfer: TRANSFER

cash_type_map:
  quantity_col: Amount
  types:
    Cash Dividend: CASH-IN
    Non-Qualified Div: CASH-IN
    Credit Interest: CASH-IN
    Long Term Cap Gain: CASH-IN
    Short Term Cap Gain Reinvest: CASH-IN
    Reinvest Dividend: CASH-IN
    Sell: CASH-IN
    Buy: CASH-OUT
    Reinvest Shares: CASH-OUT
  ticker_fallback_types:
    Security Transfer: CASH-IN

skip_types:
  - Journal # seem to be no-ops

date_format: "%m/%d/%Y"

defaults:
  currency: USD
  cash_ticker: CASH-USD
